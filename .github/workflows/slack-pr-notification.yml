name: Notify Slack about new PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

jobs:
  notify-slack:
    name: Send PR notification to Slack
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Send notification to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MARI_SLACK_ID: ${{ secrets.MARI_SLACK_ID }}

          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR_ID: ${{ secrets.MARI_SLACK_ID }}
          REPOSITORY: ${{ github.event.repository.name }}

        run: |
          payload=$(jq -n \
            --arg mari_id "$MARI_SLACK_ID" \
            --arg repository "$REPOSITORY" \
            --arg author_id "$PR_AUTHOR_ID" \
            --arg title "$PR_TITLE" \
            --arg url "$PR_URL" \
            '{
              "text": ("Alô <@" + $mari_id + "> — Brisa chegou com um PR do " + $repository + " enviado por <@" + $author_id + ">"),

              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": (
                      "👋 Alô <@" + $mari_id + "> — Brisa chegou com um PR do *" +
                      $repository +
                      "* enviado por <@" + $author_id + ">.\n\n" +
                      "<" + $url + "|:github-octo: " + $title + ">"
                    )
                  }
                }
              ]
            }')

          curl --fail-with-body -X POST \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"